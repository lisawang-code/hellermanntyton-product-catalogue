<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HellermannTyton Product Catalogue</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --gold: #e2b96f;
      --text: #e8e8e8;
      --text-dim: #a0a0b0;
      --page-w: 460px;
      --page-h: 636px;
    }

    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid rgba(255,255,255,.1);
      gap: 12px;
    }

    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--gold);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 5px;
      color: var(--text);
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      transition: all .2s;
    }
    .btn:hover { background: rgba(255,255,255,.15); }
    .btn.gold {
      background: rgba(226,185,111,.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 5px;
      padding: 0 10px;
      height: 32px;
    }
    .search-box input {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      width: 120px;
      outline: none;
    }
    .search-box input::placeholder { color: var(--text-dim); }

    /* Main */
    .main {
      flex: 1;
      display: flex;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      overflow: hidden;
      background: var(--surface);
      border-right: 1px solid rgba(255,255,255,.1);
      transition: width .3s;
      display: flex;
      flex-direction: column;
      z-index: 50;
    }
    .sidebar.open { width: 280px; }
    .sidebar-inner {
      width: 280px;
      padding: 12px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #tocList {
      flex: 1;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 12px;
      color: var(--gold);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* TOC section styles */
    .toc-section {
      margin-bottom: 4px;
    }
    .toc-section-header {
      padding: 10px 12px;
      background: rgba(255,255,255,.08);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      transition: all .2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toc-section-header:hover {
      background: rgba(255,255,255,.15);
    }
    .toc-arrow {
      font-size: 10px;
      color: var(--gold);
      transition: transform .2s;
    }
    .toc-children {
      max-height: 0;
      overflow: hidden;
      transition: max-height .3s ease;
      padding-left: 8px;
    }
    .toc-section.open .toc-children {
      max-height: 800px;
    }
    .toc-child-item {
      padding: 8px 12px;
      margin: 2px 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all .2s;
    }
    .toc-child-item:hover {
      background: rgba(255,255,255,.08);
      color: var(--text);
    }
    .toc-child-page {
      font-size: 11px;
      color: var(--gold);
      opacity: .7;
      white-space: nowrap;
      margin-left: 6px;
    }
    .toc-child-item:hover .toc-child-page {
      opacity: 1;
    }

    /* Book area */
    .book-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      perspective: 2000px;
    }

    /* Book */
    .book {
      display: flex;
      position: relative;
      transform-style: preserve-3d;
      filter: drop-shadow(0 20px 50px rgba(0,0,0,.7));
    }

    .page {
      width: 460px;
      height: 636px;
      background: #f5f5f0;
      position: relative;
      overflow: hidden;
    }
    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
    }

    .spine {
      width: 12px;
      background: linear-gradient(to right, #0a0a1a, #2a2a50, #0a0a1a);
    }

    /* Flip animation */
    .flipper {
      position: absolute;
      top: 0;
      width: var(--page-w);
      height: var(--page-h);
      transform-style: preserve-3d;
      display: none;
      z-index: 100;
    }
    .flipper.flipping-right {
      right: 0;
      transform-origin: left center;
    }
    .flipper.flipping-left {
      left: 0;
      transform-origin: right center;
    }
    .flipper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      backface-visibility: hidden;
    }

    @keyframes flipNext {
      from { transform: perspective(2000px) rotateY(0deg); }
      to { transform: perspective(2000px) rotateY(-180deg); }
    }
    @keyframes flipPrev {
      from { transform: perspective(2000px) rotateY(0deg); }
      to { transform: perspective(2000px) rotateY(180deg); }
    }

    .animate-next { animation: flipNext 0.5s ease-in-out forwards; }
    .animate-prev { animation: flipPrev 0.5s ease-in-out forwards; }

    /* Nav arrows */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s;
      z-index: 10;
    }
    .nav-btn:hover { opacity: 1; }
    .nav-btn.prev { left: 20px; }
    .nav-btn.next { right: 20px; }
    .nav-btn span {
      width: 40px;
      height: 40px;
      background: rgba(226,185,111,.3);
      border: 2px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--gold);
    }

    /* Page numbers */
    .page-num {
      position: absolute;
      bottom: 8px;
      font-size: 11px;
      color: rgba(0,0,0,.3);
    }
    .page-num.left { left: 15px; }
    .page-num.right { right: 15px; }

    /* Search panel */
    .search-panel {
      position: fixed;
      top: 52px;
      right: -400px;
      width: 380px;
      height: calc(100vh - 85px);
      background: var(--surface);
      border-left: 1px solid rgba(255,255,255,.1);
      transition: right .3s;
      z-index: 90;
      display: flex;
      flex-direction: column;
    }
    .search-panel.open { right: 0; }
    .search-panel-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .search-panel-title {
      font-size: 14px;
      color: var(--gold);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-close {
      cursor: pointer;
      font-size: 16px;
      color: var(--text-dim);
      padding: 4px 8px;
      border-radius: 4px;
      transition: all .2s;
    }
    .search-close:hover {
      color: var(--text);
      background: rgba(255,255,255,.1);
    }
    .search-input-wrap {
      display: flex;
      gap: 8px;
    }
    .search-input-wrap input {
      flex: 1;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 5px;
      padding: 8px 12px;
      color: var(--text);
      outline: none;
    }
    .search-input-wrap input:focus { border-color: var(--gold); }
    .search-input-wrap button {
      background: var(--gold);
      border: none;
      border-radius: 5px;
      padding: 8px 16px;
      color: #1a1a2e;
      font-weight: 600;
      cursor: pointer;
    }

    .search-results {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .search-result-item {
      padding: 12px;
      background: rgba(255,255,255,.05);
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all .2s;
    }
    .search-result-item:hover {
      background: rgba(255,255,255,.1);
      border-left-color: var(--gold);
    }
    .search-result-page {
      font-size: 11px;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .search-result-text {
      font-size: 12px;
      color: var(--text);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .highlight {
      background: rgba(226,185,111,.4);
      color: #fff;
      padding: 0 2px;
      border-radius: 2px;
    }
    .search-status {
      text-align: center;
      padding: 20px;
      color: var(--text-dim);
      font-size: 13px;
    }

    /* Zoom overlay */
    .zoom-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .zoom-overlay.active { display: flex; }
    .zoom-container {
      cursor: grab;
      transition: transform .1s;
    }
    .zoom-container:active { cursor: grabbing; }
    .zoom-container img {
      max-width: 90vw;
      max-height: 90vh;
      box-shadow: 0 20px 60px rgba(0,0,0,.8);
    }
    .zoom-close {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      color: var(--text);
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.7);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Bottom bar */
    .bottom-bar {
      height: 32px;
      background: var(--surface);
      border-top: 1px solid rgba(255,255,255,.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .progress-bar {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,.05);
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      transition: width .3s;
    }

    /* Loading */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #loading h2 { color: var(--gold); }
    #loading-bar {
      width: 300px;
      height: 4px;
      background: rgba(255,255,255,.1);
      border-radius: 2px;
      overflow: hidden;
    }
    #loading-fill {
      height: 100%;
      background: var(--gold);
      width: 0%;
      transition: width .2s;
    }

    /* Responsive */
    @media (max-width: 1000px) {

    @media (max-width: 768px) {

      .search-panel { width: 100%; right: -100%; }
      .topbar-title { display: none; }
    }
  </style>
</head>

<script>
const TOTAL_PAGES = 674;
const PAGES_DIR = 'pages/';
let currentSpread = 0;
let totalSpreads = 0;
let isAnimating = false;
let searchIndex = [];
let zoomScale = 1, zoomX = 0, zoomY = 0;
let isDragging = false;

function pageSrc(n) {
  return PAGES_DIR + 'page_' + String(n).padStart(3, '0') + '.png?v=' + Date.now();
}

function spreadToPages(s) {
  if (s === 0) return { left: null, right: 1 };
  const left = s * 2;
  const right = s * 2 + 1;
  return {
    left: left <= TOTAL_PAGES ? left : null,
    right: right <= TOTAL_PAGES ? right : null
  };
}

function pageToSpread(p) {
  return p <= 1 ? 0 : Math.floor(p / 2);
}

function render(s, animateDir) {
  const pages = spreadToPages(s);

  const imgLeft = document.getElementById('imgLeft');
  const imgRight = document.getElementById('imgRight');
  const pageLeft = document.getElementById('pageLeft');
  const pageRight = document.getElementById('pageRight');

  if (animateDir && !isAnimating) {
    isAnimating = true;
    const flipper = document.getElementById('flipper');
    const flipImg = document.getElementById('flipImg');

    flipper.style.display = 'block';
    flipper.className = 'flipper flipping-' + (animateDir === 'next' ? 'right' : 'left');
    flipImg.src = animateDir === 'next' ? imgRight.src : imgLeft.src;

    void flipper.offsetWidth;
    flipper.classList.add(animateDir === 'next' ? 'animate-next' : 'animate-prev');

    setTimeout(() => {
      flipper.style.display = 'none';
      flipper.classList.remove('animate-next', 'animate-prev');
      isAnimating = false;
    }, 500);
  }

  if (pages.left) {
    imgLeft.src = pageSrc(pages.left);
    pageLeft.style.display = 'block';
    document.getElementById('numLeft').textContent = pages.left;
  } else {
    pageLeft.style.display = 'none';
  }

  if (pages.right) {
    imgRight.src = pageSrc(pages.right);
    pageRight.style.display = 'block';
    document.getElementById('numRight').textContent = pages.right;
  } else {
    pageRight.style.display = 'none';
  }

  currentSpread = s;
  updateUI();
}

function updateUI() {
  const pages = spreadToPages(currentSpread);
  let text = '';
  if (pages.left && pages.right) text = `Pages ${pages.left}-${pages.right}`;
  else if (pages.right) text = `Page ${pages.right}`;
  else text = `Page ${pages.left}`;

  document.getElementById('status').textContent = `${text} of ${TOTAL_PAGES}`;
  document.getElementById('progress').style.width = ((currentSpread / totalSpreads) * 100) + '%';
}

function next() {
  if (currentSpread < totalSpreads && !isAnimating) {
    render(currentSpread + 1, 'next');
  }
}

function prev() {
  if (currentSpread > 0 && !isAnimating) {
    render(currentSpread - 1, 'prev');
  }
}

function goToPage(p) {
  const s = pageToSpread(p);
  if (s !== currentSpread) {
    render(s, s > currentSpread ? 'next' : 'prev');
  }
}

function buildTOC() {
  const list = document.getElementById('tocList');

  tocData.forEach((section, idx) => {
    const sectionEl = document.createElement('div');
    sectionEl.className = 'toc-section';

    const header = document.createElement('div');
    header.className = 'toc-section-header';
    header.innerHTML = `<span class="toc-arrow">▶</span> ${section.title}`;
    header.onclick = () => {
      sectionEl.classList.toggle('open');
      const arrow = header.querySelector('.toc-arrow');
      arrow.textContent = sectionEl.classList.contains('open') ? '▼' : '▶';
    };

    const childrenEl = document.createElement('div');
    childrenEl.className = 'toc-children';

    section.children.forEach(child => {
      const item = document.createElement('div');
      item.className = 'toc-child-item';
      item.innerHTML = `<span class="toc-child-title">${child.title}</span><span class="toc-child-page">p.${child.page}</span>`;
      item.onclick = (e) => {
        e.stopPropagation();
        goToPage(child.page);
      };
      childrenEl.appendChild(item);
    });

    sectionEl.appendChild(header);
    sectionEl.appendChild(childrenEl);
    list.appendChild(sectionEl);
  });
}

async function loadSearchIndex() {
  try {
    const res = await fetch('search_index.json');
    if (res.ok) {
      searchIndex = await res.json();
    } else {
      console.error('Failed to load search index:', res.status);
      showSearchError('Failed to load search index (HTTP ' + res.status + ').');
    }
  } catch (e) {
    console.error('Search index load error:', e);
    showSearchError('Search requires a local server. Please run start-server.bat or deploy to a web server.');
  }
}

function showSearchError(msg) {
  const container = document.getElementById('searchResults');
  container.innerHTML = '<div class="search-status" style="color:#e2b96f;text-align:left;line-height:1.6;">' + msg + '</div>';
}

function doSearch(query) {
  if (!query) {
    document.getElementById('searchResults').innerHTML = '<div class="search-status">Enter keywords to search</div>';
    return;
  }
  if (!searchIndex.length) {
    document.getElementById('searchResults').innerHTML = '<div class="search-status" style="color:#e2b96f;">Search index is loading... If this persists, please run start-server.bat.</div>';
    return;
  }

  const q = query.toLowerCase();
  const results = searchIndex.filter(item => item.text.toLowerCase().includes(q));

  const container = document.getElementById('searchResults');
  if (!results.length) {
    container.innerHTML = '<div class="search-status">No matches found</div>';
    return;
  }

  container.innerHTML = `<div class="search-status">${results.length} results found</div>`;
  results.forEach(r => {
    const idx = r.text.toLowerCase().indexOf(q);
    const snippet = r.text.substring(Math.max(0, idx - 30), idx + q.length + 30);
    const highlighted = snippet.replace(new RegExp(q, 'gi'), m => `<span class="highlight">${m}</span>`);

    const item = document.createElement('div');
    item.className = 'search-result-item';
    item.innerHTML = `<div class="search-result-page">Page ${r.page}</div><div class="search-result-text">...${highlighted}...</div>`;
    item.onclick = () => goToPage(r.page);
    container.appendChild(item);
  });
}

function openZoom(page) {
  document.getElementById('zoomImg').src = pageSrc(page);
  document.getElementById('zoomOverlay').classList.add('active');
  zoomScale = 1; zoomX = 0; zoomY = 0;
  updateZoom();
}

function updateZoom() {
  document.getElementById('zoomContainer').style.transform = `translate(${zoomX}px, ${zoomY}px) scale(${zoomScale})`;
}

// Events
document.getElementById('navPrev').onclick = prev;
document.getElementById('navNext').onclick = next;
document.getElementById('btnToc').onclick = () => document.getElementById('sidebar').classList.toggle('open');

document.getElementById('contentSearch').oninput = function() {
  document.getElementById('searchPanel').classList.add('open');
  document.getElementById('panelSearchInput').value = this.value;
  doSearch(this.value);
};

document.getElementById('btnSearch').onclick = () => doSearch(document.getElementById('panelSearchInput').value);
document.getElementById('panelSearchInput').onkeydown = e => { if (e.key === 'Enter') doSearch(e.target.value); };

document.getElementById('btnCloseSearch').onclick = () => {
  document.getElementById('searchPanel').classList.remove('open');
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    document.getElementById('searchPanel').classList.remove('open');
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft') prev();
});

document.getElementById('imgLeft').onclick = () => {
  const p = spreadToPages(currentSpread).left;
  if (p) openZoom(p);
};
document.getElementById('imgRight').onclick = () => {
  const p = spreadToPages(currentSpread).right;
  if (p) openZoom(p);
};

document.getElementById('btnZoomClose').onclick = () => document.getElementById('zoomOverlay').classList.remove('active');
document.getElementById('zoomOverlay').onclick = e => { if (e.target === e.currentTarget) document.getElementById('zoomOverlay').classList.remove('active'); };

const zoomContainer = document.getElementById('zoomContainer');
let dragStartX = 0, dragStartY = 0;

zoomContainer.onmousedown = e => {
  isDragging = true;
  dragStartX = e.clientX - zoomX;
  dragStartY = e.clientY - zoomY;
  zoomContainer.style.cursor = 'grabbing';
  e.preventDefault();
};

document.onmousemove = e => {
  if (!isDragging) return;
  zoomX = e.clientX - dragStartX;
  zoomY = e.clientY - dragStartY;
  updateZoom();
};

document.onmouseup = () => {
  isDragging = false;
  zoomContainer.style.cursor = 'grab';
};

document.getElementById('zoomOverlay').onwheel = e => {
  e.preventDefault();
  zoomScale = Math.max(0.5, Math.min(4, zoomScale + (e.deltaY > 0 ? -0.1 : 0.1)));
  updateZoom();
};

document.querySelector('.book-area').onwheel = e => {
  e.preventDefault();
  if (e.deltaY > 0) next(); else prev();
};

document.getElementById('btnFullscreen').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

let bookScale = 1;
document.getElementById('btnZoomIn').onclick = () => {
  bookScale = Math.min(1.5, bookScale + 0.1);
  document.getElementById('book').style.transform = `scale(${bookScale})`;
};
document.getElementById('btnZoomOut').onclick = () => {
  bookScale = Math.max(0.7, bookScale - 0.1);
  document.getElementById('book').style.transform = `scale(${bookScale})`;
};

async function init() {
  totalSpreads = Math.ceil((TOTAL_PAGES - 1) / 2);

  buildTOC();
  await loadSearchIndex();

  document.getElementById('loading').style.display = 'none';
  render(0);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

</body>
